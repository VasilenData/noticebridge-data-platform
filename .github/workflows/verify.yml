name: Verify and publish NoticeBridge

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noticebridge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - name: Source, identity and publication regressions
        run: pytest -q --junitxml=test-results.xml
      - name: Browser filtering and export regressions
        run: node --test web/test-ui.mjs
      - name: Reproduce the checked-in source release
        run: python -m noticebridge verify --source data/source_snapshot.json --output web/data.json
      - name: Exercise interrupted publication and recovery
        run: python -m noticebridge exercise --output "${{ runner.temp }}/noticebridge-evidence.json"
      - name: Retain actual CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ github.sha }}
          path: |
            test-results.xml
            ${{ runner.temp }}/noticebridge-evidence.json
          retention-days: 14
          if-no-files-found: warn
      - name: Prepare the read-only site
        run: python package_site.py
      - name: Upload verified public files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Deploy the verified static site
        id: deployment
        uses: actions/deploy-pages@v4
