name: Capture recent TED publication partitions

on:
  # Schedule intentionally disabled: TED XML returned an explicit access challenge
  # to the hosted runner on 2026-11-15. See docs/OPERATIONS.md; do not bypass it.
  # Restore a schedule only after a permitted execution environment is verified.
  workflow_dispatch:
    inputs:
      lookback:
        description: Calendar-day lookback (UTC); actual observation times are retained
        type: choice
        options: ['1', '3', '7']
        default: '3'

permissions:
  contents: read

concurrency:
  group: noticebridge-publication
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect, replay and stage a complete verified edition
        env:
          LOOKBACK: ${{ inputs.lookback || '3' }}
        run: python -m noticebridge.operations refresh --lookback "$LOOKBACK"
      - name: Independently replay the archived inputs
        run: python -m noticebridge.operations verify
      - name: Commit only the validated public capture and release artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/captures.json data/captures web/current.json web/releases
          if ! git diff --cached --quiet; then
            git commit -m "Record verified TED capture and replay edition"
            git push origin HEAD:main
          fi
      - name: Explicitly dispatch the verification and Pages gate on the new head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run verify.yml --ref main
      - name: Retain the capture index and selected edition pointer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-${{ github.run_id }}
          path: |
            data/captures.json
            web/current.json
          retention-days: 14
