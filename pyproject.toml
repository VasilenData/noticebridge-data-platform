[project]
name = "noticebridge-data-platform"
version = "0.2.0"
description = "Source-linked procurement notice changes and deterministic evidence releases"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests", "sources"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

